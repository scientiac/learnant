{% extends "base.html" %}

{% block title %}Assign learner · {{ course.title }}{% endblock %}

{% block content %}
  <p><a href="{% url 'assignment-list' course.id %}">Back to assignments</a></p>
  <h1>Assign learner to {{ course.title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Assign learner</button>
  </form>
{% endblock %}
