<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tenant Learning{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Tenant Learning</a>
        <div class="ms-auto">
          {% if user.is_authenticated %}
            <span class="navbar-text me-3">{{ user.username }} · {{ user.get_role_display }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
            </form>
          {% else %}
            <a class="btn btn-primary btn-sm" href="{% url 'login' %}">Log in</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
