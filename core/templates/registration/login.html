{% extends "base.html" %}

{% block title %}Log in · Tenant Learning{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
      <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="p-6">
          <h1 class="mb-4 text-xl font-semibold">Log in</h1>
          {% if form.errors %}
            <div class="mb-4 rounded-md border border-red-200 bg-red-50 p-3 text-red-900">Invalid username or password.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <label class="mb-1 block text-sm font-medium" for="{{ form.username.id_for_label }}">Username</label>
              {{ form.username }}
            </div>
            <div class="mb-4">
              <label class="mb-1 block text-sm font-medium" for="{{ form.password.id_for_label }}">Password</label>
              {{ form.password }}
            </div>
            <button class="w-full rounded-md bg-slate-950 px-4 py-2 text-white hover:bg-slate-800" type="submit">Log in</button>
          </form>
        </div>
      </div>
  </div>
{% endblock %}
